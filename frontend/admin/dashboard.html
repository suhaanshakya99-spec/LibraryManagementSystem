<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Shelfmark Staff</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="dashboard.html">Shelfmark</a>
    <span class="brand-sub">Staff desk</span>

    <ul class="nav">
      <li><a href="dashboard.html" class="active">Overview</a></li>
      <li><a href="books.html">Books</a></li>
      <li><a href="members.html">Members</a></li>
      <li><a href="borrows.html">Borrows &amp; requests</a></li>
    </ul>

    <div class="sidebar-foot">
      <div class="sidebar-user">Signed in as staff</div>
      <a href="#" class="btn btn--ghost-ink btn--sm btn--block" id="sign-out">Sign out</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <span class="eyebrow">Overview</span>
      <h1>Circulation desk</h1>
      <p>A snapshot of the whole collection.</p>
    </div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-tile"><span class="value">—</span><span class="label">Total books</span></div>
      <div class="stat-tile"><span class="value">—</span><span class="label">Available</span></div>
      <div class="stat-tile"><span class="value">—</span><span class="label">Borrowed</span></div>
      <div class="stat-tile"><span class="value">—</span><span class="label">Total members</span></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Most recent borrows</h2>
        <a href="borrows.html" class="btn btn--ghost btn--sm">Manage borrows</a>
      </div>
      <div class="table-scroll">
        <table class="ledger">
          <thead>
            <tr><th>Book</th><th>Member</th><th>Borrowed</th><th>Due</th><th>Status</th></tr>
          </thead>
          <tbody id="recent-body">
            <tr class="empty-row"><td colspan="5">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  requireAdminAuth();
  document.getElementById("sign-out").addEventListener("click", (e) => {
    e.preventDefault();
    signOut("admin");
  });

  async function load() {
    try {
      const data = await apiRequest("/library/admin/dashboard/", "GET", null, "admin");

      const tiles = document.querySelectorAll("#stat-grid .stat-tile .value");
      tiles[0].textContent = data.total_books;
      tiles[1].textContent = data.available_books;
      tiles[2].textContent = data.borrowed_books;
      tiles[3].textContent = data.total_members;

      const body = document.getElementById("recent-body");
      if (data.recent_borrows.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="5">No borrows recorded yet.</td></tr>`;
        return;
      }

      body.innerHTML = data.recent_borrows
        .map(
          (b) => `
        <tr>
          <td>${escapeHtml(b.books.title)}</td>
          <td>${escapeHtml(b.members.name)}</td>
          <td class="mono">${formatDate(b.borrow_date)}</td>
          <td class="mono">${formatDate(b.due_date)}</td>
          <td>${stampBadge(b.status)}</td>
        </tr>`
        )
        .join("");
    } catch (err) {
      toast(err.message, "error");
    }
  }

  load();
</script>
</body>
</html>
