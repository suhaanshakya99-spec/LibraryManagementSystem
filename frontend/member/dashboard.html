<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · Shelfmark</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <a class="brand" href="dashboard.html">Shelfmark</a>
    <span class="brand-sub">Member desk</span>

    <ul class="nav">
      <li><a href="dashboard.html" class="active">Overview</a></li>
      <li><a href="books.html">Browse books</a></li>
      <li><a href="borrows.html">My borrows &amp; requests</a></li>
    </ul>

    <div class="sidebar-foot">
      <div class="sidebar-user" id="sidebar-user">—</div>
      <a href="#" class="btn btn--ghost-ink btn--sm btn--block" id="sign-out">Sign out</a>
    </div>
  </aside>

  <main class="main">
    <div class="page-head">
      <span class="eyebrow">Overview</span>
      <h1>Welcome back</h1>
      <p>A quick look at your account with the library.</p>
    </div>

    <div class="stat-grid" id="stat-grid">
      <div class="stat-tile"><span class="value">—</span><span class="label">Active borrows</span></div>
      <div class="stat-tile"><span class="value">—</span><span class="label">Overdue</span></div>
      <div class="stat-tile"><span class="value">—</span><span class="label">Pending requests</span></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Recent borrows</h2>
        <a href="borrows.html" class="btn btn--ghost btn--sm">View all</a>
      </div>
      <div class="table-scroll">
        <table class="ledger">
          <thead>
            <tr><th>Book</th><th>Borrowed</th><th>Due</th><th>Status</th></tr>
          </thead>
          <tbody id="recent-borrows-body">
            <tr class="empty-row"><td colspan="4">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  requireMemberAuth();
  document.getElementById("sign-out").addEventListener("click", (e) => {
    e.preventDefault();
    signOut("member");
  });

  // show the signed-in member's email, read from their access token
  const payload = decodeJwt(getToken("member"));
  document.getElementById("sidebar-user").textContent = (payload && payload.email) || "Signed in";

  async function load() {
    try {
      const borrows = await apiRequest("/library/member/borrows/mine", "GET", null, "member");
      const requests = await apiRequest("/library/member/request/mine", "GET", null, "member");

      const active = borrows.filter((b) => b.status !== "Returned").length;
      const overdue = borrows.filter((b) => b.status === "Overdue").length;
      const pending = requests.filter((r) => r.status === "Pending").length;

      const tiles = document.querySelectorAll("#stat-grid .stat-tile .value");
      tiles[0].textContent = active;
      tiles[1].textContent = overdue;
      tiles[2].textContent = pending;

      const body = document.getElementById("recent-borrows-body");
      const recent = [...borrows]
        .sort((a, b) => new Date(b.borrow_date) - new Date(a.borrow_date))
        .slice(0, 5);

      if (recent.length === 0) {
        body.innerHTML = `<tr class="empty-row"><td colspan="4">You haven't borrowed any books yet.</td></tr>`;
        return;
      }

      body.innerHTML = recent
        .map(
          (b) => `
        <tr>
          <td>${escapeHtml(b.books.title)}</td>
          <td class="mono">${formatDate(b.borrow_date)}</td>
          <td class="mono">${formatDate(b.due_date)}</td>
          <td>${stampBadge(b.status)}</td>
        </tr>`
        )
        .join("");
    } catch (err) {
      toast(err.message, "error");
    }
  }

  load();
</script>
</body>
</html>
