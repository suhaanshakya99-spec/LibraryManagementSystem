<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Sign In · Shelfmark</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">
    <span class="eyebrow">Staff desk</span>
    <h1>Sign in</h1>
    <p class="lede">Library staff credentials only.</p>

    <div id="error-box" class="error-box"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Staff name</label>
        <input type="text" id="username" required autocomplete="username" placeholder="Admin">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn--brass btn--block" id="submit-btn">Sign in</button>
    </form>

    <div class="auth-foot">
      <a href="../index.html">&larr; Back to portal chooser</a>
    </div>
  </div>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
  if (getToken("admin")) window.location.href = "dashboard.html";

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("error-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span> Signing in…';

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      // admin login endpoint also expects OAuth2 form fields
      const data = await apiRequest("/library/admin/login/", "POST", { username: username, password: password }, null, true);
      saveTokens("admin", data.access_token, data.refresh_token);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign in";
    }
  });
</script>
</body>
</html>
